name: Build DMG

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: ./scripts/build.sh
      - name: Build DMG
        run: ./scripts/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Pinhole-dmg
          path: dist/*.dmg
